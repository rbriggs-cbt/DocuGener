version: '3.8'

services:
  docugener:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docugener
    ports:
      - "5000:5000"  # Backend API
      - "5100:5100"   # Frontend web interface
    volumes:
      # Persist captures and database
      - ./data/captures:/app/backend/captures
      - ./data/database:/app/backend
    environment:
      - DISPLAY=:99
      - PYTHONUNBUFFERED=1
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # For Linux hosts, you may need to add:
    # network_mode: host
    # For better X11 support (if running on Linux with X server)
    # Note: Screenshot capture requires access to display server
    restart: unless-stopped
    # Uncomment if you need privileged mode for better hardware access
    # privileged: true
